name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: Pruebas y build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar las pruebas
        run: npm test

      - name: Compilar la app
        run: npm run build

      - name: Comprobar el resultado del build
        run: test -f dist/index.html && test -f dist/js/app.js && test -f dist/styles.css
